name: Create Ubuntu Image
description: Creates an Ubuntu image for Raspberry Pi preloaded with ROS2, Wifi, SSH, and this repository.

permissions: write-all

on:
  workflow_dispatch:
    inputs:
      ubuntu_image:
        description: 'Ubuntu Image'
        type: choice
        required: true
        default: '24.04.4'
        options:
          - 24.04.4
          - 22.04.5
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLIC_KEY: ''
      NAME: ''
    steps:
      - name: Setup Environment
        run: |
          echo "NAME=$(echo "${{ github.event.repository.name }}" | rev | cut -d'_' -f2- | rev)" >> "$GITHUB_ENV"
          ssh-keygen -t ed25519 -f ./id_ed25519 -N ''
          echo "PUBLIC_KEY=$(cat ./id_ed25519.pub)" >> "$GITHUB_ENV"

      - name: Create Deploy Key
        uses: octokit/request-action@v2.x
        id: add_deploy_key
        with:
          route: POST /repos/${{ github.repository }}/keys
          owner: ${{ github.repository_owner }}
          repo: ${{ github.event.repository.name }}
          title: ${{ env.NAME }}
          key: ${{ env.PUBLIC_KEY }}
          read_only: false
        env:
          GITHUB_TOKEN: ${{ secrets.ADMIN_PAT }}

      - name: Customize Image
        uses: pguyot/arm-runner-action@v2
        with:
          base_image: https://cdimage.ubuntu.com/releases/${{inputs.ubuntu_image}}/release/ubuntu-${{inputs.ubuntu_image}}-preinstalled-server-arm64+raspi.img.xz
          image_additional_mb: 2048
          commands: |
            # Prevent interactive prompts during apt
            export DEBIAN_FRONTEND=noninteractive

            # Setup User
            groupadd -f i2c
            useradd -m -s /bin/bash ${{ env.NAME }}
            usermod -aG sudo,i2c,dialout,video ${{ env.NAME }}
            echo "${{ env.NAME }}:${{ env.NAME }}" | chpasswd

            # Set Hostname
            echo "${{ env.NAME }}" > /etc/hostname
            sed -i "s/127.0.1.1.*/127.0.1.1 ${{ env.NAME }}/g" /etc/hosts

            # Update Cloud-Init
            sed -i "s/name: ubuntu/name: ${{ env.NAME }}/g" /etc/cloud/cloud.cfg
            sed -i 's/preserve_hostname: false/preserve_hostname: true/g' /etc/cloud/cloud.cfg
            chage -I -1 -m 0 -M 99999 -E -1 ${{ env.NAME }}
            
            # Upgrade packages safely
            apt-get update
            apt-get upgrade -y -q

            # Install ROS2 Deb
            apt-get install curl -y
            export ROS_APT_SOURCE_VERSION=$(curl -s https://api.github.com/repos/ros-infrastructure/ros-apt-source/releases/latest | grep -F "tag_name" | awk -F'"' '{print $4}')
            curl -L -o /tmp/ros2-apt-source.deb "https://github.com/ros-infrastructure/ros-apt-source/releases/download/${ROS_APT_SOURCE_VERSION}/ros2-apt-source_${ROS_APT_SOURCE_VERSION}.$(. /etc/os-release && echo ${UBUNTU_CODENAME:-${VERSION_CODENAME}})_all.deb"
            dpkg -i /tmp/ros2-apt-source.deb

            # Determine ROS Distro based on Ubuntu version
            if [[ "${{ inputs.ubuntu_image }}" == "24.04"* ]]; then
              ROS_DISTRO="jazzy"
            elif [[ "${{ inputs.ubuntu_image }}" == "22.04"* ]]; then
              ROS_DISTRO="humble"
            else
              ROS_DISTRO="humble" # Fallback
            fi

            # Install ROS2
            apt-get update
            apt-get install ros-$ROS_DISTRO-desktop python3-colcon-common-extensions python3-colcon-mixin git -y

            # Copy SSH Key
            SSH_DIR="/home/${{ env.NAME }}/.ssh"
            mkdir -p $SSH_DIR
            cp ./id_ed25519 $SSH_DIR/id_ed25519
            cp ./id_ed25519.pub $SSH_DIR/id_ed25519.pub
            
            # Trust GitHub host key to prevent git clone hanging
            ssh-keyscan github.com >> $SSH_DIR/known_hosts

            # Fix permissions before clone
            chmod 700 $SSH_DIR
            chmod 600 $SSH_DIR/id_ed25519
            chmod 644 $SSH_DIR/id_ed25519.pub $SSH_DIR/known_hosts
            chown -R ${{ env.NAME }}:${{ env.NAME }} $SSH_DIR

            # Clone Repo as the target user (prevents root ownership)
            su - ${{ env.NAME }} -c "git clone --recurse-submodules git@github.com:${{ github.repository }}.git /home/${{ env.NAME }}/${{ github.event.repository.name }}"

      - name: Rename Image
        run: mv ubuntu-${{inputs.ubuntu_image}}-preinstalled-server-arm64+raspi.img ubuntu.img

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{inputs.ubuntu_image}}-${{ github.run_number }}
          name: Ubuntu ${{inputs.ubuntu_image}} Image
          draft: false
          prerelease: false
          files: ubuntu.img
